<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body>

    <h2>Register User</h2>
    <input type="text" id="nameInput" placeholder="Enter name">
     <input type="text" id="emailInput" placeholder="Enter email">
     <input type="text" id = "collegeInput" placeholder="Enter department in college">
     

    <button onclick= "sendData()">Submit</button>

    <script>
        async function sendData() {
            const userTypedName = document.getElementById("nameInput").value;

            const userTypedEmail = document.getElementById("emailInput").value;

            const userTypedCollege = document.getElementById("collegeInput").value;


            const userDataObject = {
                name: userTypedName,
                email: userTypedEmail,
                department: userTypedCollege,
            }

            const jsonText = JSON.stringify(userDataObject);
            const response = await fetch('http://localhost:3000/register', {
                method: 'POST',
                headers: {'Content-type': 'application/json'},
                body: jsonText
            })
        }

            async function getRegistrationById(id){
                try{
                    const response = await fetch(`http://localhost:3000/registrations/${id}`);
                    const data = await response.json();
                    return data;
                }

                catch(err){
                    console.error(err);
            }
        }
    </script>
</body>
</html>
